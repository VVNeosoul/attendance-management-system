# サーバーポート番号（服务器端口）
server.port=8080

# データベース接続設定（数据库连接配置）
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.config.import=optional:classpath:application-local.properties

# MyBatis設定：将数据库的下划线命名(emp_name)自动映射为Java的驼峰命名(empName)
mybatis.configuration.map-underscore-to-camel-case=true
# 在控制台打印执行的SQL日志（方便调试和截图打Evidence）
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 指定 MyBatis XML 文件的存放路径
mybatis.mapper-locations=classpath:mapper/*.xml

